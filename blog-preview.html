<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Section Preview - A CAN SOLUTIONS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  
  <!-- ========================================================== -->
  <!-- BLOG SECTION PREVIEW                                       -->
  <!-- ========================================================== -->
  <section class="blog" id="blog" aria-labelledby="blog-title">
    <div class="container">
      <header class="blog__header">
        <h2 class="blog__title reveal reveal--pop reveal--ready is-visible" id="blog-title">BLOG</h2>
      </header>

      <ul class="blog-list" role="list">
        <!-- Blog Post 1 -->
        <li class="blog-card reveal reveal--slide-l reveal--ready is-visible">
          <a href="#" class="blog-card__link">
            <div class="blog-card__image">
              <img src="assets/img/blog-outsourcing.jpg" alt="Outsourcing" width="300" height="170" loading="lazy" />
            </div>
            <div class="blog-card__content">
              <div class="blog-card__header">
                <time class="blog-card__date" datetime="2025-05-16">2025/5/16</time>
              </div>
              <h3 class="blog-card__title">人材不足時代の経営戦略 - なぜ今、<br />BPO/KPO活用企業が競争力を高めているのか</h3>
              <div class="blog-card__category">BPO/KPO活用ガイド</div>
              <div class="blog-card__tags">
                <span class="blog-card__tag">#BPO</span>
                <span class="blog-card__tag">#KPO</span>
                <span class="blog-card__tag">#アウトソーシング</span>
                <span class="blog-card__tag">#人材不足</span>
                <span class="blog-card__tag">#生産性向上</span>
                <span class="blog-card__tag">#経営戦略</span>
                <span class="blog-card__tag">#ミャンマー</span>
                <span class="blog-card__tag">#DX</span>
              </div>
            </div>
          </a>
        </li>

        <!-- Blog Post 2 -->
        <li class="blog-card reveal reveal--slide-r reveal--ready is-visible">
          <a href="#" class="blog-card__link">
            <div class="blog-card__image">
              <img src="assets/img/blog-bpo.jpg" alt="BPO業務選定" width="300" height="170" loading="lazy" />
            </div>
            <div class="blog-card__content">
              <div class="blog-card__header">
                <time class="blog-card__date" datetime="2025-05-16">2025/5/16</time>
              </div>
              <h3 class="blog-card__title">どの業務をBPO化すべきか？失敗しない業務<br />選定のポイント</h3>
              <div class="blog-card__category">BPO/KPO活用ガイド</div>
              <div class="blog-card__tags">
                <span class="blog-card__tag">#BPO</span>
                <span class="blog-card__tag">#KPO</span>
                <span class="blog-card__tag">#アウトソーシング</span>
                <span class="blog-card__tag">#業務効率化</span>
                <span class="blog-card__tag">#人材不足</span>
                <span class="blog-card__tag">#バックオフィス改革</span>
                <span class="blog-card__tag">#ミャンマー</span>
                <span class="blog-card__tag">#DX</span>
              </div>
            </div>
          </a>
        </li>
      </ul>
    </div>
  </section>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
