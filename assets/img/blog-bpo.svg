<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a68968;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4a07a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="700" height="400" fill="url(#bgGrad2)"/>
  
  <!-- Image effect: desk with laptop -->
  <!-- Desk surface -->
  <rect x="0" y="180" width="700" height="220" fill="#8b6f47"/>
  <rect x="0" y="180" width="700" height="10" fill="#6d5635"/>
  
  <!-- Laptop -->
  <g>
    <!-- Laptop screen -->
    <rect x="180" y="100" width="340" height="220" fill="#2c2c2c" rx="8"/>
    <rect x="195" y="115" width="310" height="185" fill="#4a9fd8"/>
    
    <!-- Screen content - chart/graph visualization -->
    <g opacity="0.9">
      <!-- Bar chart -->
      <rect x="220" y="200" width="40" height="70" fill="#2ecc71"/>
      <rect x="280" y="180" width="40" height="90" fill="#3498db"/>
      <rect x="340" y="160" width="40" height="110" fill="#e74c3c"/>
      <rect x="400" y="140" width="40" height="130" fill="#f39c12"/>
      
      <!-- Line indicators -->
      <line x1="220" y1="150" x2="440" y2="150" stroke="#fff" stroke-width="1" stroke-dasharray="4"/>
      <line x1="220" y1="200" x2="440" y2="200" stroke="#fff" stroke-width="1" stroke-dasharray="4"/>
      <line x1="220" y1="250" x2="440" y2="250" stroke="#fff" stroke-width="1" stroke-dasharray="4"/>
    </g>
    
    <!-- Laptop base -->
    <polygon points="140,320 560,320 520,340 180,340" fill="#3c3c3c"/>
    <ellipse cx="350" cy="330" rx="15" ry="5" fill="#555"/>
  </g>
  
  <!-- Coffee cup on desk -->
  <g>
    <ellipse cx="600" cy="280" rx="35" ry="10" fill="#5a4a3a"/>
    <rect x="565" y="250" width="70" height="30" fill="#7a5a4a" rx="2"/>
    <rect x="560" y="255" width="80" height="25" fill="#8b6a5a" rx="2"/>
    <!-- Steam -->
    <path d="M 580 240 Q 575 220 580 210" stroke="#ddd" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 590 240 Q 585 218 590 208" stroke="#ddd" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 600 240 Q 595 220 600 210" stroke="#ddd" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  
  <!-- Hand with pen (suggestion of work) -->
  <g>
    <!-- Hand -->
    <ellipse cx="120" cy="300" rx="30" ry="20" fill="#d4a574" opacity="0.9"/>
    <rect x="90" y="290" width="40" height="35" fill="#d4a574" rx="8" opacity="0.9"/>
    
    <!-- Pen -->
    <rect x="105" y="250" width="8" height="60" fill="#2c5aa0" rx="2" transform="rotate(-25 109 280)"/>
    <polygon points="107,245 109,245 108,235" fill="#1a3a70" transform="rotate(-25 108 240)"/>
  </g>
  
  <!-- Paper/document on desk -->
  <rect x="220" y="340" width="120" height="50" fill="#f8f8f8" opacity="0.9"/>
  <line x1="230" y1="355" x2="330" y2="355" stroke="#666" stroke-width="2"/>
  <line x1="230" y1="365" x2="310" y2="365" stroke="#999" stroke-width="1.5"/>
  <line x1="230" y1="373" x2="320" y2="373" stroke="#999" stroke-width="1.5"/>
  
  <!-- Overlay for atmosphere -->
  <rect width="700" height="400" fill="#000" opacity="0.05"/>
</svg>
