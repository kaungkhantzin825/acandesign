<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5490;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2971b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a8dd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="400" fill="url(#bgGrad1)"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="700" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="700" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="700" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="700" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="700" y2="400" stroke="#fff" stroke-width="1"/>
    
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="140" y1="0" x2="140" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="280" y1="0" x2="280" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Main text -->
  <text x="350" y="160" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">
    OUTSOURCING
  </text>
  
  <!-- Decorative lines -->
  <line x1="80" y1="200" x2="280" y2="200" stroke="#4dd0e1" stroke-width="4"/>
  <line x1="420" y1="200" x2="620" y2="200" stroke="#4dd0e1" stroke-width="4"/>
  
  <!-- Subtitle sections -->
  <rect x="80" y="240" width="180" height="60" fill="#2962a3" opacity="0.8"/>
  <text x="170" y="275" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    BUSINESS
  </text>
  
  <rect x="280" y="240" width="140" height="60" fill="#3a78c1" opacity="0.8"/>
  <text x="350" y="275" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    STRATEGY
  </text>
  
  <rect x="440" y="240" width="180" height="60" fill="#4a8ee0" opacity="0.8"/>
  <text x="530" y="275" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    SOLUTION
  </text>
</svg>
